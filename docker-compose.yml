services:
  postgres:
    image: postgres:17-alpine
    container_name: labdoc-postgres
    environment:
      POSTGRES_DB: labdoc
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "5434:5432"          # 5434 no host: o stack rag-luan-learning ja usa 5433
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d labdoc"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.16.1
    container_name: labdoc-qdrant
    ports:
      - "6335:6333"          # REST + dashboard
      - "6336:6334"          # gRPC (e o que o Qdrant.Client usa)
    volumes:
      - qdrantdata:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: labdoc-api
    profiles: ["api"]        # so sobe com --profile api
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      # __ vira ":" na configuracao do .NET — sobrescreve o appsettings.json
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=labdoc;Username=rag;Password=rag"
      Qdrant__Host: "qdrant"
      Qdrant__Port: "6334"
      Llm__Endpoint: "http://host.docker.internal:11434/v1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: labdoc-ui
    ports:
      - "4301:8080"
    environment:
      # Para onde o nginx encaminha /api.
      #   dotnet run no host  -> host.docker.internal:5277
      #   API no compose      -> api:8080  (suba com --profile api)
      API_UPSTREAM: "api:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  qdrantdata:
